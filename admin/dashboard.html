<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EC Control Center</title>

<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/tables.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="dashboardLayout">

    <aside class="sidebar">

        <div class="logo">

            <h1>EC</h1>

            <h2>Control Center</h2>

        </div>

        <nav>

            <a class="active">

                <i class="fa-solid fa-chart-line"></i>

                Dashboard

            </a>

            <a>

                <i class="fa-solid fa-users"></i>

                Clients

            </a>

            <a>

                <i class="fa-solid fa-folder-open"></i>

                Projects

            </a>

            <a>

                <i class="fa-solid fa-images"></i>

                Portfolio

            </a>

            <a>

                <i class="fa-solid fa-file-signature"></i>

                Quotes

            </a>

            <a>

                <i class="fa-solid fa-user-group"></i>

                Referral Network

            </a>

            <a>

                <i class="fa-solid fa-chart-simple"></i>

                Analytics

            </a>

            <a>

                <i class="fa-solid fa-gear"></i>

                Settings

            </a>

        </nav>

    </aside>

    <main class="dashboardContent">

        <header class="dashboardHeader">

            <div>

                <h1>

                    Welcome Back, Troy

                </h1>

                <p>

                    EC Framework Core

                </p>

            </div>

        </header>

        <section class="statsGrid">

            <div class="statCard">

                <h3>Projects</h3>

                <span>0</span>

            </div>

            <div class="statCard">

                <h3>Clients</h3>

                <span>0</span>

            </div>

            <div class="statCard">

                <h3>Referral Partners</h3>

                <span>0</span>

            </div>

            <div class="statCard">

                <h3>Quote Requests</h3>

                <span>0</span>

            </div>

        </section>

        <section class="activityCard">

            <h2>

                Recent Activity

            </h2>

            <p>

                Activity will appear here as your business grows.

            </p>

        </section>

        <section class="quickActions">

            <h2>

                Quick Actions

            </h2>

            <div class="actionGrid">

                <button>New Client</button>

                <button>New Project</button>

                <button>New Quote</button>

                <button>Referral Partner</button>

            </div>

        </section>

    </main>

</div>

<script src="js/dashboard.js"></script>

</body>
</html>
